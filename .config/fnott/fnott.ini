[main]
title-font=JetBrainsMono Nerd Font:size=13
summary-font=JetBrainsMono Nerd Font:size=11
body-font=JetBrainsMono Nerd Font:size=12

anchor=top-right
notification-margin=14
padding-vertical=14
padding-horizontal=18
border-size=1
border-radius=10
max-width=460

[low]
