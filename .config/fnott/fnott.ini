summary-color=dbe0e8ff
body-color=dbe0e8ff
progress-color=69b9f7ff

[critical]
background=2b2f35f5
border-color=fe9864ff
title-color=fe9864ff
summary-color=dbe0e8ff
body-color=dbe0e8ff
progress-color=fa94cdff
