# Terminal and clipboard
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:RGB"
set -g mouse on
set -s set-clipboard on

# Use Vim keys in copy mode
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi V send -X select-line
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# Window and pane numbering
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

# Prefix
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Reload config
unbind p
bind p source-file "$HOME/.config/tmux/tmux.conf" \; display-message "tmux config reloaded"

# Set ts.sh
bind-key -r f run-shell "tmux neww $HOME/.scripts/ts.sh"

# Split panes in the current directory
unbind %
bind | split-window -h -c "#{pane_current_path}"
unbind '"'
bind - split-window -v -c "#{pane_current_path}"

# Navigate panes
bind -n C-h select-pane -L
bind -n C-j select-pane -D
bind -n C-k select-pane -U
bind -n C-l select-pane -R

# Resize panes
bind h resize-pane -L 5
bind j resize-pane -D 5
bind k resize-pane -U 5
bind l resize-pane -R 5
bind m resize-pane -Z

# New window in the current directory
unbind n
bind n new-window -c "#{pane_current_path}"

# Navigate windows
bind -n M-h previous-window
bind -n M-l next-window
bind -n M-[ previous-window
bind -n M-] next-window

# Rename window
unbind r
bind r command-prompt "rename-window '%%'"

# Statusline
set -g status-position top
set -g status-justify centre
set -g status-style "bg=default,fg=color8"
set -g status-left-length 40
set -g status-right-length 100
set -g status-left "#[fg=color4,bold] 󰆍 #S #[fg=color8] "
set -g status-right "#[fg=color8]󰥔 %Y-%m-%d 󰅐 %H:%M "

set -g window-status-format "#[fg=color8] #I:#W "
set -g window-status-current-format "#[fg=color4,bold] 󰖯 #I:#W "
set -g window-status-separator ""

set -g pane-border-style "fg=color0"
set -g pane-active-border-style "fg=color4"
set -g mode-style "bg=color0,fg=color7"
set -g message-style "bg=color0,fg=color3"
set -g message-command-style "bg=color0,fg=color3"

set -g window-status-style "fg=color8,nounderscore"
set -g window-status-current-style "fg=color4,bold,nounderscore"

set -g status-interval 5
set -g status-right "#(sh \"$HOME/.config/tmux/git-status.sh\" \"#{pane_current_path}\") "
