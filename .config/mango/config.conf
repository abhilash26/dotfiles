# MangoWM configuration

# Autostart
exec_once="~/.config/mango/autostart.sh"

# Layouts and workspaces
# Supported layouts: tile, monocle, center_tile
tag_rule=id:1,layout_name:tile
tag_rule=id:2,layout_name:tile
tag_rule=id:3,layout_name:tile
tag_rule=id:4,layout_name:tile
tag_rule=id:5,layout_name:tile
tag_rule=id:6,layout_name:tile
tag_rule=id:7,layout_name:tile
tag_rule=id:8,layout_name:tile
tag_rule=id:9,layout_name:tile

tag_num=9
circle_layout=tile,monocle

# Master-stack layout
new_is_master=1
default_master_factor=0.55
default_master_count=1

# Monocle layout
monocle_tab_mode=1
monocle_no_border=0
monocle_no_gap=0
monocle_no_radius=0

# Programs
bind=SUPER,w,spawn,helium-browser
bind=SUPER+SHIFT,w,spawn,helium-browser --incognito
bind=SUPER,p,spawn,fuzzel
bind=SUPER,e,spawn,pcmanfm
bind=SUPER,z,spawn_shell,wall.sh
bind=SUPER,Return,spawn,foot
bind=SUPER,b,spawn_shell,killall -SIGUSR2 waybar || waybar &

bind=SUPER,n,spawn,fnottctl dismiss
bind=SUPER+SHIFT,n,spawn,fnottctl dismiss all

# Media keys
bind=NONE,XF86AudioMute,spawn_shell,volume.sh mute
bind=NONE,XF86AudioRaiseVolume,spawn_shell,volume.sh up 5
bind=NONE,XF86AudioLowerVolume,spawn_shell,volume.sh down 5
bind=NONE,XF86AudioPrev,spawn,mpc prev
bind=NONE,XF86AudioNext,spawn,mpc next
bind=NONE,XF86AudioPlay,spawn,mpc toggle
bind=NONE,XF86AudioStop,spawn,mpc stop
bind=SUPER,F1,spawn,volume.sh mute
bind=SUPER,F2,spawn,volume.sh down 5
bind=SUPER,F3,spawn,volume.sh up 5
bind=SUPER,F11,spawn,brightness.sh down 5
bind=SUPER,F12,spawn,brightness.sh up 5

# Workspace navigation
bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0

bind=SUPER,Up,viewtoright,0
bind=SUPER,Down,viewtoleft,0

# Move focused window to a workspace
bind=SUPER+SHIFT,1,tag,1,0
bind=SUPER+SHIFT,2,tag,2,0
bind=SUPER+SHIFT,3,tag,3,0
bind=SUPER+SHIFT,4,tag,4,0
bind=SUPER+SHIFT,5,tag,5,0
bind=SUPER+SHIFT,6,tag,6,0
bind=SUPER+SHIFT,7,tag,7,0
bind=SUPER+SHIFT,8,tag,8,0
bind=SUPER+SHIFT,9,tag,9,0

# Layout switching
bind=SUPER,space,switch_layout

# Window focus
bind=SUPER,Left,focusstack,previous
bind=SUPER,Right,focusstack,next
bind=SUPER,h,focusdir,left
bind=SUPER,l,focusdir,right
bind=SUPER,k,focusdir,up
bind=SUPER,j,focusdir,down

# Move focused window
bind=SUPER+SHIFT,Up,move_client,up
bind=SUPER+SHIFT,Down,move_client,down
bind=SUPER+SHIFT,Left,move_client,left
bind=SUPER+SHIFT,Right,move_client,right

bind=SUPER+SHIFT,k,move_client,up
bind=SUPER+SHIFT,j,move_client,down
bind=SUPER+SHIFT,h,move_client,left
bind=SUPER+SHIFT,l,move_client,right

# Resize window
bind=SUPER+CTRL,h,resizewin,-50,+0
bind=SUPER+CTRL,j,resizewin,+0,+50
bind=SUPER+CTRL,k,resizewin,+0,-50
bind=SUPER+CTRL,l,resizewin,+50,+0

bind=SUPER+CTRL,Left,resizewin,-50,+0
bind=SUPER+CTRL,Down,resizewin,+0,+50
bind=SUPER+CTRL,Up,resizewin,+0,-50
bind=SUPER+CTRL,Right,resizewin,+50,+0

# Window state
bind=SUPER,f,togglefloating,
bind=SUPER,m,togglemaximizescreen,
bind=SUPER+SHIFT,f,togglefullscreen,
bind=SUPER+CTRL,f,togglefakefullscreen,
bind=SUPER+SHIFT,m,minimized,
bind=SUPER+SHIFT+CTRL,m,restore_minimized

# Close focused window
bind=SUPER,q,killclient,

# Configuration and session controls
bind=SUPER+CTRL,r,reload_config
bind=SUPER+CTRL,q,quit

# Mouse bindings
# btn_left and btn_right can't bind none mod key
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=NONE,btn_middle,togglemaximizescreen,0
mousebind=SUPER,btn_right,moveresize,curresize

# Window behavior
smart_gaps=0
no_border_when_single=0
axis_bind_apply_timeout=100
focus_on_activate=1
idle_inhibit_ignore_visible=0
idle_inhibit_when_fullscreen=0
sloppy_focus=1
warp_cursor=1
focus_cross_monitor=0
focus_direction_only_zone_overlap=1
focus_cross_tag=0
enable_floating_snap=0
snap_distance=30
float_full_to_top=0
drag_tile_to_tile=1
drag_tile_small=1

# Overview
hotarea_size=10
enable_hotarea=0
hotarea_disable_on_fullscreen=1
overview_gap_inner=5
overview_gap_outer=30
overcircle_center_ratio=0.5
title_message_bar_height=52
title_message_bar_gap=20

# Gaps and borders
gap_inner_horizontal=5
gap_inner_vertical=5
gap_outer_horizontal=10
gap_outer_vertical=10
border_px=4
border_radius=6
no_radius_when_single=0

# Colors
root_color=0x0f1318ff
border_color=0x2b2f35ff
drop_color=0x54dcaa33
split_color=0xfe986466
focus_color=0xfa94cd99
maximized_screen_color=0x54dcaa99
urgent_color=0xfe986499
scratchpad_color=0x69b9f799
global_color=0xfa94cd66
overlay_color=0x6ae5ec66

# Colors
root_color=0x0f1318ff
border_color=0x2b2f35ff
drop_color=0x71998733
split_color=0xbd8062ff
focus_color=0xaa7892cc
maximized_screen_color=0x719987ff
urgent_color=0xbd8062ff
scratchpad_color=0x66849aff
global_color=0x927b94ff
overlay_color=0x668f91ff

# Opacity and dimming
focused_opacity=1.0
unfocused_opacity=1.0
dim_enable=0
dim_focused_color=0x00000000
dim_unfocused_color=0x00000055

# Blur
blur=0
blur_layer=0
blur_optimized=1
blur_params_num_passes = 2
blur_params_radius = 5
blur_params_noise = 0.02
blur_params_brightness = 0.9
blur_params_contrast = 0.9
blur_params_saturation = 1.2

# Shadows
shadows = 0
layer_shadows = 0
shadow_only_floating = 1
shadows_size = 10
shadows_blur = 15
shadows_position_x = 0
shadows_position_y = 0
shadows_color= 0x000000ff

# Animations (supported types: zoom, slide)
# tag_animation_direction: 1 = horizontal, 0 = vertical
animations=1
layer_animations=1
animation_type_open=slide
animation_type_close=slide
animation_fade_in=1
animation_fade_out=1
tag_animation_direction=1
zoom_initial_ratio=0.4
zoom_end_ratio=0.8
fade_in_begin_opacity=0.5
fade_out_begin_opacity=0.8
animation_duration_move=400
animation_duration_open=400
animation_duration_tag=350
animation_duration_close=150
animation_duration_focus=0
animation_curve_open=0.46,1.0,0.29,1
animation_curve_move=0.46,1.0,0.29,1
animation_curve_tag=0.46,1.0,0.29,1
animation_curve_close=0.08,0.92,0,1
animation_curve_focus=0.46,1.0,0.29,1
animation_curve_opacity_fade_out=0.5,0.5,0.5,0.5
animation_curve_opacity_fade_in=0.46,1.0,0.29,1

# Layer rules
layer_rule=animation_type_open:zoom,layer_name:fuzzel
layer_rule=animation_type_close:zoom,layer_name:fuzzel

# Keyboard
# Key names refer to `xev` or `wev` output.
# Modifier names: super, ctrl, alt, shift, none
repeat_rate=25
repeat_delay=600
numlock_on=0
xkb_rules_layout=us

# Trackpad
# Changes require relogin to apply.
disable_trackpad=0
tap_to_click=1
tap_and_drag=1
drag_lock=1
trackpad_natural_scrolling=0
trackpad_disable_while_typing=1
trackpad_left_handed=0
trackpad_middle_button_emulation=0
swipe_min_threshold=1

# Mouse
# Changes require relogin to apply.
mouse_natural_scrolling=0

# Cursor
cursor_size=24
